[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate-interior"]
  timeout = 120

[functions."bb-menu"]
  timeout = 120

[functions."gemini-brandboss"]
  timeout = 120

[functions."bb-logo"]
  timeout = 60

# ★ gemini-rebrandboss는 Background Function으로 전환됨
#   (netlify/functions/gemini-rebrandboss-background.js)
#   이유: 이 플랜(nf_team_dev)의 동기 함수는 CDN이 30초에 강제 종료한다.
#   timeout=120은 플랜 상한(최대 26초)을 넘는 값이라 애초에 적용되지 않았다.
#   백그라운드 함수의 실행 한도는 15분 고정이며 timeout 설정 대상이 아니다.

[functions."bb-brandname"]
  timeout = 60

[functions."bb-competition"]
  timeout = 60

[functions."bb-save"]
  timeout = 30

[functions."bb-projects"]
  timeout = 30

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/share/*"
  to = "/index.html"
  status = 200
